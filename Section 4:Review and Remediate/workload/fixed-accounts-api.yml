apiVersion: v1
kind: ServiceAccount
metadata:
  name: accounts-api
  namespace: accounts
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/accounts-api-pod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: accounts-api
  namespace: accounts
spec:
  replicas: 3
  selector: {matchLabels: {app: accounts-api}}
  template:
    metadata: {labels: {app: accounts-api}}
    spec:
      serviceAccountName: accounts-api
      hostNetwork: false
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: 111122223333.dkr.ecr.ap-south-1.amazonaws.com/accounts-api@sha256:REPLACE-WITH-RELEASE-DIGEST
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          env:
            - name: DB_SECRET_NAME
              value: accounts/prod/db
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: accounts-api, namespace: accounts}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["accounts-api-config"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: accounts-api, namespace: accounts}
subjects:
  - {kind: ServiceAccount, name: accounts-api, namespace: accounts}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: accounts-api}
