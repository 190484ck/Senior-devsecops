apiVersion: apps/v1
kind: Deployment
metadata: {name: accounts-api, namespace: accounts}
spec:
  template:
    spec:
      hostNetwork: true
      containers:
        - name: api
          image: 123456789012.dkr.ecr.ap-south-1.amazonaws.com/accounts-api:latest
          securityContext: {privileged: false, allowPrivilegeEscalation: true, runAsNonRoot: false}
