apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata: {name: aws-secretsmanager, namespace: accounts}
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
      auth:
        jwt:
          serviceAccountRef: {name: accounts-api}
      role: arn:aws:iam::111122223333:role/accounts-api-secrets-read
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: {name: accounts-api-runtime, namespace: accounts}
spec:
  refreshInterval: 1m
  secretStoreRef: {name: aws-secretsmanager, kind: SecretStore}
  target: {name: accounts-api-runtime, creationPolicy: Owner}
  data:
    - secretKey: kyc-api-key
      remoteRef: {key: accounts/prod/kyc, property: api_key}
